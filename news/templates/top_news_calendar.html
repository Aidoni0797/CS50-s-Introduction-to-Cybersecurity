{% load static %}
<section class="top-news-calendar">
  <div class="top-news-container">

    <!-- ТОП-3 НОВОСТИ -->
    <div class="top-news">
      <h3>ТОП-3 НОВОСТИ</h3>
      <div class="top-news-list">
        {% for news in top_news %}
          <div class="top-news-item">
            <a href="{% url 'news_detail' slug=news.slug %}">
              {% if news.image %}
                <img src="{{ news.image.url }}" alt="{{ news.title }}">
              {% endif %}
              <div class="top-news-text">
                <h4>{{ news.title }}</h4>
                <p>{{ news.content|truncatewords:20 }}</p>
              </div>
            </a>
          </div>
        {% empty %}
          <p>Пока нет топ-новостей.</p>
        {% endfor %}
      </div>
    </div>

    <!-- КАЛЕНДАРЬ -->
    <div class="calendar-block">
      <h3>КАЛЕНДАРЬ</h3>
      <div class="calendar">
        <div class="calendar-header">
          <button id="prevMonth">‹</button>
          <span id="monthYear"></span>
          <button id="nextMonth">›</button>
        </div>
        <table id="calendarTable">
          <thead>
            <tr>
              <th>Пн</th><th>Вт</th><th>Ср</th><th>Чт</th><th>Пт</th><th>Сб</th><th>Вс</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const monthYear = document.getElementById("monthYear");
  const calendarBody = document.querySelector("#calendarTable tbody");
  let currentDate = new Date();

  function renderCalendar(date) {
    const year = date.getFullYear();
    const month = date.getMonth();
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const daysInMonth = lastDay.getDate();
    const startDay = firstDay.getDay() || 7;

    calendarBody.innerHTML = "";
    monthYear.textContent = date.toLocaleString('ru-RU', { month: 'long', year: 'numeric' });

    let row = document.createElement("tr");
    for (let i = 1; i < startDay; i++) {
      row.appendChild(document.createElement("td"));
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const cell = document.createElement("td");
      cell.textContent = day;
      if (day === new Date().getDate() && month === new Date().getMonth()) {
        cell.classList.add("today");
      }
      row.appendChild(cell);

      if ((startDay + day - 1) % 7 === 0) {
        calendarBody.appendChild(row);
        row = document.createElement("tr");
      }
    }
    calendarBody.appendChild(row);
  }

  document.getElementById("prevMonth").addEventListener("click", () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar(currentDate);
  });

  document.getElementById("nextMonth").addEventListener("click", () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar(currentDate);
  });

  renderCalendar(currentDate);
});
</script>
